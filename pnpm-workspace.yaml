packages:
  - "packages/*"
  - "apps/*"
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - turbo@2.11.13
  - vitest@5.1.1
  - lucide-react-native@1.75.0
  - lucide-react@1.75.0
  - "@testing-library/user-event@14.6.13"

# pnpm blocks dependency build scripts by default. esbuild (tsup / Vite / Storybook) needs its postinstall.
allowBuilds:
  esbuild: true
